<!DOCTYPE html>
<html lang="es" id="contenedorMain" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://unab.edu.co/congresofacultadsalud/wp-content/uploads/sites/4/2022/09/cropped-favicon-azul-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="../CSS/Global.css">
    <link rel="stylesheet" href="../CSS/Layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../CSS/EstilosLibreto.css">
    <script defer src="../JS/components.js"></script>
    <script defer src="../JS/shared.js"></script>
    <script defer src="../JS/Libreta.js"></script>
    <title>Libreta Estudiantil</title>
</head>
<body>
    <div data-portal-header="libreta"></div>
    <br>
    <div class="contenedor">
        <div class="cabecera">
            <h1>Libreta Estudiantil</h1>
        </div>
        
        <div class="info-estudiante">
            <div>
                <strong>Estudiante:</strong> <span id="nombreEstudiante">Diego Andres Meza Rodriguez</span>
            </div>
            <div>
                <strong>Programa:</strong> <span id="programaEstudiante">Medicina</span>
            </div>
            <div>
                <strong>ID:</strong> <span id="idEstudiante">U00123456</span>
            </div>
        </div>
        
        <div class="progreso-contenedor">
            <h2>Progreso de Horas Libres</h2>
            <div class="progreso-barra-contenedor">
                <div id="progresoHoras" class="progreso-barra" style="width: 0%">0%</div>
            </div>
            <div id="resumenHoras">
                <strong>Horas acumuladas:</strong> <span id="horasAcumuladas">0</span> | 
                <strong>Horas restantes:</strong> <span id="horasRestantes">90</span> | 
                <strong>Total requerido:</strong> 90 horas
            </div>
        </div>
        
        <div class="lista-eventos" id="listaEventos">
        </div>
        
        <div class="resumen-total">
            <div>
                <strong>Total Horas Acumuladas:</strong> <span id="totalHorasAcumuladas">0</span>
            </div>
            <div>
                <strong>Horas Restantes:</strong> <span id="totalHorasRestantes">90</span>
                <span id="badgeEstado" class="badge-pendiente">Pendiente</span>
            </div>
        </div>
    </div>
    <br>
    <div
    data-portal-footer></div>
</body>
</html>
